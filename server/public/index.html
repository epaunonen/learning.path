<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>learning.path — data engineering tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-page:    #080e1a;
      --bg-surface: #0d1625;
      --bg-raised:  #111e32;
      --bg-hover:   #172540;
      --bg-input:   #0a1220;
      --accent:     #2d7dd2;
      --accent-dim: #1a4a7a;
      --accent-glow:#3d9be8;
      --green:      #3aab6c;
      --green-dim:  #1a4a2e;
      --amber:      #d4900a;
      --amber-dim:  #3d2800;
      --red:        #d94f4f;
      --red-dim:    #3d1414;
      --text-primary:   #d6e4f7;
      --text-secondary: #7a9bc4;
      --text-tertiary:  #3d5a7a;
      --border-faint: rgba(45,125,210,0.12);
      --border-mid:   rgba(45,125,210,0.25);
      --border-accent:rgba(45,125,210,0.6);
      --radius-md: 8px;
      --radius-lg: 12px;
      --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 1.5rem;
    }

    input, select, textarea {
      font-family: inherit;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-input);
      border: 0.5px solid var(--border-mid);
      border-radius: var(--radius-md);
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: var(--bg-raised); }

    button {
      font-family: inherit;
      font-size: 13px;
      color: var(--text-secondary);
      background: transparent;
      border: 0.5px solid var(--border-mid);
      border-radius: var(--radius-md);
      padding: 7px 10px;
      cursor: pointer;
      outline: none;
      transition: background 0.13s, border-color 0.13s, color 0.13s;
    }
    button:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-accent); }

    .app { max-width: 1100px; margin: 0 auto; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 1.5rem;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: var(--radius-md);
      background: var(--accent-dim); border: 0.5px solid var(--border-accent);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      color: var(--accent-glow); letter-spacing: 0.04em;
    }
    .brand-title { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
    .brand-sub   { font-size: 11px; color: var(--text-tertiary); font-family: var(--mono); margin-top: 1px; }

    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .filter-btn {
      font-size: 11px; font-family: var(--mono);
      padding: 4px 11px; border-radius: 20px;
      border: 0.5px solid var(--border-faint);
      color: var(--text-tertiary);
    }
    .filter-btn:hover { border-color: var(--border-accent); color: var(--text-secondary); background: var(--bg-hover); }
    .filter-btn.active { background: var(--accent-dim); color: var(--accent-glow); border-color: var(--border-accent); }

    .tag-select {
      font-family: var(--mono); font-size: 11px;
      padding: 4px 9px; border-radius: 20px;
      border: 0.5px solid var(--border-faint);
      background: transparent; color: var(--text-tertiary);
    }

    .add-btn {
      font-size: 12px; font-family: var(--mono);
      padding: 6px 14px; border-radius: var(--radius-md);
      border: 0.5px solid var(--border-accent);
      color: var(--accent-glow); font-weight: 700;
      background: var(--accent-dim);
    }
    .add-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .stats-row {
      display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 10px; margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--bg-surface);
      border: 0.5px solid var(--border-faint);
      border-radius: var(--radius-md); padding: 13px 15px;
    }
    .stat-label { font-size: 10px; font-family: var(--mono); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 5px; }
    .stat-value { font-size: 23px; font-weight: 700; font-family: var(--mono); color: var(--text-primary); }

    .columns { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; align-items: start; }

    .col-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px; padding-bottom: 9px;
      border-bottom: 0.5px solid var(--border-faint);
    }
    .col-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-backlog { background: var(--text-tertiary); }
    .dot-active  { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .dot-done    { background: var(--green); }
    .col-title { font-size: 10px; font-family: var(--mono); font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.1em; }
    .col-count { font-size: 10px; font-family: var(--mono); background: var(--bg-raised); color: var(--text-tertiary); padding: 1px 7px; border-radius: 10px; border: 0.5px solid var(--border-faint); }

    .card {
      background: var(--bg-surface);
      border: 0.5px solid var(--border-faint);
      border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 8px;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .card:hover { border-color: var(--border-mid); background: var(--bg-raised); }
    .card.selected { border-color: var(--accent); background: var(--bg-raised); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 7px; }
    .card-name { font-size: 13px; font-weight: 500; line-height: 1.35; color: var(--text-primary); }

    .badge { font-size: 10px; font-family: var(--mono); padding: 2px 8px; border-radius: 10px; flex-shrink: 0; font-weight: 700; }
    .cert-yes { background: var(--amber-dim); color: var(--amber); border: 0.5px solid rgba(212,144,10,0.3); }
    .cert-no  { background: var(--bg-raised); color: var(--text-tertiary); border: 0.5px solid var(--border-faint); }

    .card-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .tag { font-size: 10px; font-family: var(--mono); padding: 2px 7px; border-radius: 10px; background: var(--accent-dim); color: var(--accent-glow); border: 0.5px solid rgba(45,125,210,0.2); }
    .provider-tag { font-size: 10px; font-family: var(--mono); color: var(--text-tertiary); }

    .card-link {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 7px; font-size: 10px; font-family: var(--mono);
      color: var(--accent-glow); text-decoration: none; opacity: 0.7;
      transition: opacity 0.13s;
    }
    .card-link:hover { opacity: 1; text-decoration: underline; }

    .progress-bar { margin-top: 9px; height: 3px; background: var(--bg-page); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; background: var(--accent); }
    .progress-fill.done { background: var(--green); }

    .empty-col {
      border: 0.5px dashed var(--border-faint); border-radius: var(--radius-lg);
      padding: 24px; text-align: center; font-size: 11px; color: var(--text-tertiary);
      font-family: var(--mono);
    }

    .detail-panel {
      background: var(--bg-surface);
      border: 0.5px solid var(--border-accent);
      border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 1.5rem;
    }
    .detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
    .detail-name { font-size: 15px; font-weight: 700; color: var(--text-primary); line-height: 1.3; }
    .detail-close { font-size: 18px; border: none; background: none; color: var(--text-tertiary); padding: 0 6px; line-height: 1; }
    .detail-close:hover { color: var(--text-primary); background: none; border: none; }

    .detail-sub { font-size: 11px; color: var(--text-tertiary); font-family: var(--mono); margin-bottom: 12px; }

    .detail-url-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-family: var(--mono);
      color: var(--accent-glow); text-decoration: none;
      background: var(--accent-dim); border: 0.5px solid var(--border-accent);
      border-radius: var(--radius-md); padding: 5px 12px; margin-bottom: 12px;
      transition: background 0.13s;
    }
    .detail-url-link:hover { background: var(--bg-hover); }

    .move-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .move-btn { font-size: 11px; font-family: var(--mono); padding: 4px 12px; border-radius: var(--radius-md); }
    .del-btn {
      font-size: 11px; font-family: var(--mono); padding: 4px 12px;
      border-radius: var(--radius-md); margin-left: auto;
      border-color: rgba(217,79,79,0.35); color: var(--red);
    }
    .del-btn:hover { background: var(--red-dim); border-color: var(--red); color: var(--red); }

    .detail-fields { display: flex; flex-direction: column; gap: 10px; }
    .detail-field label {
      display: block; font-size: 10px; font-family: var(--mono);
      color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px;
    }
    .detail-field input, .detail-field textarea { width: 100%; }
    .detail-field textarea { height: 60px; resize: vertical; }

    .progress-row { display: flex; align-items: center; gap: 10px; }
    .progress-row input[type=range] { flex: 1; accent-color: var(--accent); }
    .progress-pct { font-size: 12px; font-family: var(--mono); color: var(--text-secondary); min-width: 32px; text-align: right; }

    .save-row { display: flex; justify-content: flex-end; margin-top: 6px; }
    .save-btn { font-size: 11px; font-family: var(--mono); padding: 5px 14px; border-radius: var(--radius-md); color: var(--accent-glow); border-color: var(--border-accent); }
    .save-btn:hover { background: var(--accent-dim); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(4,9,18,0.82);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem;
    }
    .modal {
      background: var(--bg-raised);
      border: 0.5px solid var(--border-accent);
      border-radius: var(--radius-lg); padding: 1.5rem; width: 100%; max-width: 460px;
    }
    .modal-title { font-size: 14px; font-weight: 700; font-family: var(--mono); color: var(--text-primary); margin-bottom: 1.1rem; }
    .field { margin-bottom: 11px; }
    .field label { display: block; font-size: 10px; font-family: var(--mono); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
    .field input, .field select, .field textarea { width: 100%; }
    .field textarea { height: 56px; resize: vertical; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }
    .btn-primary {
      padding: 7px 18px; border-radius: var(--radius-md); font-weight: 700;
      font-family: var(--mono); font-size: 12px;
      background: var(--accent); color: #fff; border: none;
    }
    .btn-primary:hover { background: var(--accent-glow); color: #fff; border: none; }
    .btn-cancel { padding: 7px 14px; border-radius: var(--radius-md); font-family: var(--mono); font-size: 12px; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-page); }
    ::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }

    @media (max-width: 640px) {
      .columns { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div id="error-banner" style="display:none;position:fixed;top:1rem;right:1rem;background:#3d1414;color:#f09595;border:0.5px solid rgba(217,79,79,0.5);border-radius:8px;padding:8px 14px;font-family:var(--mono);font-size:12px;z-index:200;"></div>
<div class="app" id="app"></div>

<script>
(function() {
  const PROVIDERS = ['Confluent','Databricks','dbt Labs','Google','AWS','Azure','Coursera','Linux Foundation','HashiCorp','DataCamp','Udemy','Snowflake','Starburst','Airbyte','Fivetran'];

  let items = [];

  let nextId = 1;
  let filterTag = 'all', filterCert = 'all', selectedId = null, showModal = false;

  // ── persistence ──────────────────────────────────────────────────────────
  async function loadData() {
    try {
      const res = await fetch('/api/data');
      const data = await res.json();
      if (Array.isArray(data) && data.length) {
        items = data.map(i => ({ url: '', ...i }));
        nextId = Math.max(...items.map(i=>i.id)) + 1;
      }
    } catch(e) {
      showError('Could not load data from server.');
    }
    render();
  }

  function save() {
    fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(items),
    }).catch(() => showError('Save failed — check server connection.'));
  }

  function showError(msg) {
    const el = document.getElementById('error-banner');
    if (el) { el.textContent = msg; el.style.display = 'block'; setTimeout(() => { el.style.display = 'none'; }, 4000); }
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function filtered() {
    return items.filter(i => {
      const tagOk  = filterTag  === 'all' || i.tags.includes(filterTag);
      const certOk = filterCert === 'all' || (filterCert === 'cert' ? i.cert : !i.cert);
      return tagOk && certOk;
    });
  }

  function colItems(status) { return filtered().filter(i => i.status === status); }

  function stats() {
    return {
      total:  items.length,
      active: items.filter(i=>i.status==='active').length,
      done:   items.filter(i=>i.status==='done').length,
      certs:  items.filter(i=>i.cert && i.status==='done').length,
    };
  }

  function getSelected() { return selectedId ? items.find(i=>i.id===selectedId) : null; }

  const LINK_SVG = `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-4M9 1h6m0 0v6m0-6L7 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function render() {
    const s = stats();
    const sel = getSelected();
    const cols = ['backlog','active','done'];
    const colLabels = { backlog:'Backlog', active:'In progress', done:'Completed' };
    const uniqueTags = [...new Set(items.flatMap(i=>i.tags))].sort();

    document.getElementById('app').innerHTML = `
      <div class="topbar">
        <div class="brand">
          <div class="brand-icon">DE</div>
          <div>
            <div class="brand-title">learning.path</div>
            <div class="brand-sub">data engineering tracker</div>
          </div>
        </div>
        <div class="controls">
          <button class="filter-btn ${filterCert==='all'?'active':''}" onclick="setCertFilter('all')">all</button>
          <button class="filter-btn ${filterCert==='cert'?'active':''}" onclick="setCertFilter('cert')">cert only</button>
          <button class="filter-btn ${filterCert==='course'?'active':''}" onclick="setCertFilter('course')">courses</button>
          <select class="tag-select" onchange="setTagFilter(this.value)">
            <option value="all" ${filterTag==='all'?'selected':''}>all topics</option>
            ${uniqueTags.map(t=>`<option value="${esc(t)}" ${filterTag===t?'selected':''}>${esc(t)}</option>`).join('')}
          </select>
          <button class="add-btn" onclick="openModal()">+ add item</button>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card"><div class="stat-label">total items</div><div class="stat-value">${s.total}</div></div>
        <div class="stat-card"><div class="stat-label">in progress</div><div class="stat-value" style="color:var(--accent-glow)">${s.active}</div></div>
        <div class="stat-card"><div class="stat-label">completed</div><div class="stat-value" style="color:var(--green)">${s.done}</div></div>
        <div class="stat-card"><div class="stat-label">certs earned</div><div class="stat-value" style="color:var(--amber)">${s.certs}</div></div>
      </div>

      ${sel ? `
      <div class="detail-panel">
        <div class="detail-top">
          <span class="detail-name">${esc(sel.name)}</span>
          <button class="detail-close" onclick="closeDetail()">×</button>
        </div>
        <div class="detail-sub">${esc(sel.provider)} · ${sel.cert?'certification track':'course / learning path'}</div>

        ${sel.url ? `<a class="detail-url-link" href="${esc(sel.url)}" target="_blank" rel="noopener">${LINK_SVG} open course page</a>` : ''}

        <div class="move-btns">
          ${sel.status!=='backlog'?`<button class="move-btn" onclick="moveTo(${sel.id},'backlog')">→ backlog</button>`:''}
          ${sel.status!=='active'?`<button class="move-btn" onclick="moveTo(${sel.id},'active')">→ in progress</button>`:''}
          ${sel.status!=='done'?`<button class="move-btn" onclick="moveTo(${sel.id},'done')">→ completed</button>`:''}
          <button class="del-btn" onclick="deleteItem(${sel.id})">remove</button>
        </div>

        <div class="detail-fields">
          <div class="detail-field">
            <label>course / materials url</label>
            <input id="det-url" type="url" placeholder="https://..." value="${esc(sel.url||'')}" />
          </div>
          ${sel.status==='active'?`
          <div class="detail-field">
            <label>progress</label>
            <div class="progress-row">
              <input type="range" min="0" max="100" step="5" value="${sel.progress}" oninput="liveProgress(${sel.id},+this.value)" />
              <span class="progress-pct" id="pct-out">${sel.progress}%</span>
            </div>
          </div>`:''}
          <div class="detail-field">
            <label>notes</label>
            <textarea id="det-notes" placeholder="exam date, key topics, thoughts...">${esc(sel.notes||'')}</textarea>
          </div>
        </div>
        <div class="save-row">
          <button class="save-btn" onclick="saveDetail(${sel.id})">save changes</button>
        </div>
      </div>` : ''}

      <div class="columns">
        ${cols.map(status => {
          const ci = colItems(status);
          return `<div>
            <div class="col-header">
              <div class="col-dot dot-${status}"></div>
              <span class="col-title">${colLabels[status]}</span>
              <span class="col-count">${ci.length}</span>
            </div>
            ${ci.length===0?`<div class="empty-col">nothing here yet</div>`:''}
            ${ci.map(item=>`
            <div class="card ${selectedId===item.id?'selected':''}" onclick="selectItem(${item.id})">
              <div class="card-top">
                <span class="card-name">${esc(item.name)}</span>
                <span class="badge ${item.cert?'cert-yes':'cert-no'}">${item.cert?'cert':'course'}</span>
              </div>
              <div class="card-meta">
                <span class="provider-tag">${esc(item.provider)}</span>
                ${item.tags.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
              </div>
              ${item.url?`<a class="card-link" href="${esc(item.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${LINK_SVG}&nbsp;open</a>`:''}
              ${item.status==='active'&&item.progress>0?`<div class="progress-bar"><div class="progress-fill" style="width:${item.progress}%"></div></div>`:''}
              ${item.status==='done'?`<div class="progress-bar"><div class="progress-fill done" style="width:100%"></div></div>`:''}
            </div>`).join('')}
          </div>`;
        }).join('')}
      </div>

      ${showModal?`
      <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal">
          <div class="modal-title">+ add learning item</div>
          <div class="field"><label>name / course title</label><input id="m-name" type="text" placeholder="e.g. Apache Flink on Confluent Cloud" /></div>
          <div class="field">
            <label>provider</label>
            <input id="m-provider" type="text" placeholder="e.g. Confluent, Databricks" list="plist" />
            <datalist id="plist">${PROVIDERS.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
          </div>
          <div class="field"><label>course / materials url</label><input id="m-url" type="url" placeholder="https://..." /></div>
          <div class="field"><label>topics (comma separated)</label><input id="m-tags" type="text" placeholder="e.g. Streaming, Kafka, Python" /></div>
          <div class="field"><label>type</label><select id="m-cert"><option value="true">certification track</option><option value="false">course / learning path</option></select></div>
          <div class="field"><label>status</label><select id="m-status"><option value="backlog">backlog</option><option value="active">in progress</option><option value="done">completed</option></select></div>
          <div class="field"><label>notes</label><textarea id="m-notes" placeholder="exam date, resources, thoughts..."></textarea></div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">cancel</button>
            <button class="btn-primary" onclick="addItem()">add</button>
          </div>
        </div>
      </div>`:''}
    `;
  }

  window.setCertFilter = v => { filterCert=v; selectedId=null; render(); };
  window.setTagFilter  = v => { filterTag=v; selectedId=null; render(); };
  window.openModal     = () => { showModal=true; render(); };
  window.closeModal    = () => { showModal=false; render(); };
  window.selectItem    = id => { selectedId=selectedId===id?null:id; render(); };
  window.closeDetail   = () => { selectedId=null; render(); };

  window.moveTo = (id, status) => {
    const item = items.find(i=>i.id===id);
    if (!item) return;
    item.status=status;
    if (status==='done') item.progress=100;
    if (status==='backlog') item.progress=0;
    save(); render();
  };

  window.deleteItem = id => {
    if (!confirm('Remove this item?')) return;
    items=items.filter(i=>i.id!==id); selectedId=null; save(); render();
  };

  window.liveProgress = (id, val) => {
    const item = items.find(i=>i.id===id);
    if (!item) return;
    item.progress=val;
    const el = document.getElementById('pct-out');
    if (el) el.textContent=val+'%';
    save();
  };

  window.saveDetail = id => {
    const item=items.find(i=>i.id===id);
    if (!item) return;
    const urlField   = document.getElementById('det-url');
    const notesField = document.getElementById('det-notes');
    if (urlField)   item.url   = urlField.value.trim();
    if (notesField) item.notes = notesField.value.trim();
    save();
    const btn = document.querySelector('.save-btn');
    if (btn) { btn.textContent='saved ✓'; setTimeout(()=>{ btn.textContent='save changes'; },1500); }
  };

  window.addItem = () => {
    const name    = document.getElementById('m-name')?.value?.trim();
    const provider= document.getElementById('m-provider')?.value?.trim();
    const url     = document.getElementById('m-url')?.value?.trim();
    const tagsRaw = document.getElementById('m-tags')?.value?.trim();
    const cert    = document.getElementById('m-cert')?.value==='true';
    const status  = document.getElementById('m-status')?.value;
    const notes   = document.getElementById('m-notes')?.value?.trim();
    if (!name) { document.getElementById('m-name')?.focus(); return; }
    const tags=tagsRaw?tagsRaw.split(',').map(t=>t.trim()).filter(Boolean):[];
    items.push({id:nextId++,name,provider:provider||'',url:url||'',tags,cert,status,progress:status==='done'?100:0,notes:notes||''});
    showModal=false; save(); render();
  };

  loadData();
})();
</script>
</body>
</html>
